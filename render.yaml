services:
  - type: web
    name: nas-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: standard
    healthCheckPath: /api/health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: WHISPER_MODEL
        value: small
      - key: WHISPER_COMPUTE_TYPE
        value: int8
      - key: DIARIZATION_BACKEND
        value: auto
      - key: NOISE_REDUCTION
        value: "true"
      - key: CORS_ORIGINS
        sync: false
